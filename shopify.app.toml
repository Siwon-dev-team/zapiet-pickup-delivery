# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "32b74bab584e433f7032a72f3f09f47d"
name = "zapiet-pickup-delivery"
application_url = "https://judicial-specialized-mardi-edgar.trycloudflare.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2024-04"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/app/orders_create"

  [[webhooks.subscriptions]]
  topics = [ "orders/updated" ]
  uri = "/webhooks/app/orders_updated"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,read_orders,write_orders,read_locations,read_shipping,write_shipping,read_customers"

[auth]
redirect_urls = [ "https://judicial-specialized-mardi-edgar.trycloudflare.com/api/auth" ]

[app_proxy]
url = "https://judicial-specialized-mardi-edgar.trycloudflare.com/api/widget-data"
subpath = "zapiet"
prefix = "apps"
